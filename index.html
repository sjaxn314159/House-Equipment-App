// DEBUG NOTE: Executes this statement as part of the surrounding logic.
async function loadData() {

  // DEBUG NOTE: Executes this statement as part of the surrounding logic.
  try {

    // DEBUG NOTE: Creates constant response.
    const response = await fetch(API_URL);

    // DEBUG NOTE: Checks this condition before running the nested logic.
    if (!response.ok) {
      // DEBUG NOTE: Stops this operation and reports an error.
      throw new Error("Could not load app data.");
    // DEBUG NOTE: Executes this statement as part of the surrounding logic.
    }

    // DEBUG NOTE: Creates constant data.
    const data = await response.json();

    // DEBUG NOTE: Checks this condition before running the nested logic.
    if (!data.success) {
      // DEBUG NOTE: Stops this operation and reports an error.
      throw new Error(data.error || "The equipment API returned an error.");
    // DEBUG NOTE: Executes this statement as part of the surrounding logic.
    }

    // DEBUG NOTE: Executes this statement as part of the surrounding logic.
    allEquipment = data.equipment || [];
    // DEBUG NOTE: Executes this statement as part of the surrounding logic.
    allMaintenance = data.maintenance || [];
    // DEBUG NOTE: Executes this statement as part of the surrounding logic.
    allDocuments = data.documents || [];
    // DEBUG NOTE: Executes this statement as part of the surrounding logic.
    allPM = data.pm || [];
    // DEBUG NOTE: Executes this statement as part of the surrounding logic.
    allSpareParts = data.spareParts || [];

    // DEBUG NOTE: Executes this statement as part of the surrounding logic.
    loading.style.display = "none";

    // DEBUG NOTE: Executes this statement as part of the surrounding logic.
    buildFilters();
    // DEBUG NOTE: Executes this statement as part of the surrounding logic.
    buildMaintenanceEquipmentLists();
    // DEBUG NOTE: Executes this statement as part of the surrounding logic.
    buildPMLists();

    // DEBUG NOTE: Executes this statement as part of the surrounding logic.
    renderEquipment();
    // DEBUG NOTE: Executes this statement as part of the surrounding logic.
    renderMaintenance();
    // DEBUG NOTE: Executes this statement as part of the surrounding logic.
    renderDocuments();
    // DEBUG NOTE: Executes this statement as part of the surrounding logic.
    renderPM();

  // DEBUG NOTE: Executes this statement as part of the surrounding logic.
  } catch (err) {

    // DEBUG NOTE: Executes this statement as part of the surrounding logic.
    loading.style.display = "none";

    // DEBUG NOTE: Updates rendered HTML for this part of the interface.
    errorBox.innerHTML =
      // DEBUG NOTE: Executes this statement as part of the surrounding logic.
      `<div class="error">${escapeHtml(err.message)}</div>`;

  // DEBUG NOTE: Executes this statement as part of the surrounding logic.
  }

// DEBUG NOTE: Executes this statement as part of the surrounding logic.
}

    // DEBUG NOTE: Filters the current array based on the supplied condition.

    // DEBUG NOTE: Sorts the current array.

      // DEBUG NOTE: Executes this statement as part of the surrounding logic.

      // DEBUG NOTE: Executes this statement as part of the surrounding logic.

    // DEBUG NOTE: Loops through the referenced data.

// DEBUG NOTE: Defines the buildPMLists function.
function buildPMLists() {

  // DEBUG NOTE: Executes this statement as part of the surrounding logic.
  [...allEquipment]
    // DEBUG NOTE: Transforms array items into another value.
    .map(item => ({
      // DEBUG NOTE: Executes this statement as part of the surrounding logic.

    .filter(entry => entry.pmJin)
    // DEBUG NOTE: Sorts the current array.
    .sort((a,b) => compareText(a.pmJin, b.pmJin))
    // DEBUG NOTE: Executes this statement as part of the surrounding logic.
    .forEach(entry => {
      // DEBUG NOTE: Creates constant item.

      // DEBUG NOTE: Updates visible text for this interface element.

      // DEBUG NOTE: Executes this statement as part of the surrounding logic.

      // DEBUG NOTE: Creates constant formOption.

    // DEBUG NOTE: Executes this statement as part of the surrounding logic.

  // DEBUG NOTE: Executes this statement as part of the surrounding logic.
  allDocuments
    // DEBUG NOTE: Filters the current array based on the supplied condition.
    .filter(doc => doc.shortType === "WI")
    // DEBUG NOTE: Sorts the current array.
    .sort((a,b) => compareText(a.id, b.id))
    // DEBUG NOTE: Executes this statement as part of the surrounding logic.
    .forEach(doc => {
      // DEBUG NOTE: Creates constant option.
      const option = document.createElement("option");
      // DEBUG NOTE: Executes this statement as part of the surrounding logic.
      option.value = doc.id;
      // DEBUG NOTE: Updates visible text for this interface element.
      option.textContent = [doc.id, doc.title].filter(Boolean).join(" — ");
      // DEBUG NOTE: Executes this statement as part of the surrounding logic.
      pmFormWI.appendChild(option);
    // DEBUG NOTE: Executes this statement as part of the surrounding logic.
    });
// DEBUG NOTE: Executes this statement as part of the surrounding logic.
}


// DEBUG NOTE: Defines the uniqueValues function.
function uniqueValues(data, field) {

  // DEBUG NOTE: Returns this value to the caller.
  return [...new Set(
    // DEBUG NOTE: Executes this statement as part of the surrounding logic.
    data
      // DEBUG NOTE: Transforms array items into another value.
      .map(item => item[field])
      // DEBUG NOTE: Filters the current array based on the supplied condition.
      .filter(Boolean)
  // DEBUG NOTE: Sorts the current array.
  )].sort();

// DEBUG NOTE: Executes this statement as part of the surrounding logic.
}

    option.value = value;

    option.textContent = value;

function isPMOpen(pm) {
  // DEBUG NOTE: Creates constant status.
  const status = String(pm.status || "Open").trim().toLowerCase();
  // DEBUG NOTE: Returns this value to the caller.
  return !["inactive", "complete", "completed", "closed", "cancelled", "canceled"].includes(status);
// DEBUG NOTE: Executes this statement as part of the surrounding logic.
}


// DEBUG NOTE: Defines the pmDueTime function.
function pmDueTime(pm) {
  // DEBUG NOTE: Creates constant value.
  const value = pm.nextDueIso || pm.nextDue || pm.startDateIso || pm.startDate;
  // DEBUG NOTE: Checks this condition before running the nested logic.
  if (!value) return 0;
  // DEBUG NOTE: Creates constant isoTime.
  const isoTime = /^\d{4}-\d{2}-\d{2}$/.test(value)
    // DEBUG NOTE: Executes this statement as part of the surrounding logic.
    ? new Date(value + "T12:00:00").getTime()
    // DEBUG NOTE: Executes this statement as part of the surrounding logic.
    : new Date(value).getTime();
  // DEBUG NOTE: Returns this value to the caller.
  return isNaN(isoTime) ? 0 : isoTime;
// DEBUG NOTE: Executes this statement as part of the surrounding logic.
}


// DEBUG NOTE: Defines the pmStatusTag function.
function pmStatusTag(pm) {
  // DEBUG NOTE: Checks this condition before running the nested logic.
  if (!isPMOpen(pm)) return '<span class="tag pm-inactive">Inactive / Complete</span>';

  // DEBUG NOTE: Creates constant due.
  const due = pmDueTime(pm);
  // DEBUG NOTE: Checks this condition before running the nested logic.
  if (!due) return '<span class="tag pm-open">Open</span>';

  // DEBUG NOTE: Creates constant today.
  const today = startOfLocalDay(new Date()).getTime();
  // DEBUG NOTE: Creates constant days.
  const days = Math.ceil((due - today) / 86400000);

  // DEBUG NOTE: Checks this condition before running the nested logic.
  if (days < 0) return `<span class="tag pm-overdue">Overdue ${Math.abs(days)} day${Math.abs(days) === 1 ? "" : "s"}</span>`;
  // DEBUG NOTE: Checks this condition before running the nested logic.
  if (days === 0) return '<span class="tag pm-due-soon">Due Today</span>';
  // DEBUG NOTE: Checks this condition before running the nested logic.
  if (days <= 30) return `<span class="tag pm-due-soon">Due in ${days} days</span>`;
  // DEBUG NOTE: Returns this value to the caller.
  return '<span class="tag pm-open">Open</span>';
// DEBUG NOTE: Executes this statement as part of the surrounding logic.
}


// DEBUG NOTE: Defines the startOfLocalDay function.
function startOfLocalDay(date) {
  // DEBUG NOTE: Returns this value to the caller.
  return new Date(date.getFullYear(), date.getMonth(), date.getDate());
// DEBUG NOTE: Executes this statement as part of the surrounding logic.
}

// DEBUG NOTE: Defines the normalizeYesNo function.
function normalizeYesNo(value) {

  // DEBUG NOTE: Creates constant v.
  const v = String(value || "").trim().toLowerCase();

  // DEBUG NOTE: Checks this condition before running the nested logic.
  if (["yes", "y", "true", "complete", "completed"].includes(v)) {
    // DEBUG NOTE: Returns this value to the caller.
    return "Yes";
  // DEBUG NOTE: Executes this statement as part of the surrounding logic.
  }

  // DEBUG NOTE: Checks this condition before running the nested logic.
  if (["no", "n", "false", "incomplete", "open"].includes(v)) {
    // DEBUG NOTE: Returns this value to the caller.
    return "No";
  // DEBUG NOTE: Executes this statement as part of the surrounding logic.
  }

  // DEBUG NOTE: Returns this value to the caller.
  return String(value || "").trim();

// DEBUG NOTE: Executes this statement as part of the surrounding logic.
}


// DEBUG NOTE: Defines the parseSortableDate function.
function parseSortableDate(log) {

  // DEBUG NOTE: Checks this condition before running the nested logic.
  if (log.dateIso) {
    // DEBUG NOTE: Creates constant time.
    const time = new Date(log.dateIso + "T12:00:00").getTime();

    // DEBUG NOTE: Checks this condition before running the nested logic.
    if (!isNaN(time)) return time;
  // DEBUG NOTE: Executes this statement as part of the surrounding logic.
  }

  // DEBUG NOTE: Creates constant time.
  const time = new Date(log.date).getTime();

  // DEBUG NOTE: Returns this value to the caller.
  return isNaN(time) ? 0 : time;

// DEBUG NOTE: Executes this statement as part of the surrounding logic.
}


// DEBUG NOTE: Defines the todayLocal function.
function todayLocal() {

  // DEBUG NOTE: Creates constant now.
  const now = new Date();

  // DEBUG NOTE: Creates constant y.
  const y = now.getFullYear();
  // DEBUG NOTE: Creates constant m.
  const m = String(now.getMonth() + 1).padStart(2, "0");
  // DEBUG NOTE: Creates constant d.
  const d = String(now.getDate()).padStart(2, "0");

  // DEBUG NOTE: Returns this value to the caller.
  return `${y}-${m}-${d}`;

// DEBUG NOTE: Executes this statement as part of the surrounding logic.
}
