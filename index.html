<!doctype html>
<!--
  HOME PROJECTS APP - INDEX PAGE

  PURPOSE
  -------
  This file defines the visible HTML structure and styling for the Home Projects app.
  It does NOT contain the main application logic. The JavaScript logic is loaded at
  the bottom of this page from: app.js?v=11

  DEBUGGING NOTE
  --------------
  If project data, sorting, filtering, detail views, or spending calculations behave
  incorrectly, the problem is likely in app.js or the Google Apps Script back end,
  not in this file.
-->
<html lang="en">
<head>

<!-- Standard character encoding. -->
<meta charset="utf-8">

<!--
  Makes the page responsive on phones and allows use of the full iPhone viewport,
  including safe-area handling around notches/home indicators.
-->
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<!-- Browser/PWA theme and iOS home-screen behavior. -->
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Home Projects">

<!-- Progressive Web App manifest and iPhone/iPad home-screen icon. -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">

<!-- Browser tab/title-bar name. -->
<title>Home Projects</title>

<style>
/* ============================================================================
   GLOBAL THEME VARIABLES
   ============================================================================
   Centralized colors used throughout the page. Changing a value here updates
   every CSS rule that references that variable.
*/
:root{--bg:#f4f5f7;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;--dark:#111827}

/* Use border-box sizing so padding/borders do not unexpectedly increase widths. */
*{box-sizing:border-box}

/* Global page typography, background, and default text color. */
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;background:var(--bg);color:var(--text)}

/* Keep form controls consistent with the rest of the page font. */
button,input,select{font:inherit}

/*
  Main app container.
  max-width keeps the desktop version narrow/readable while auto margins center it.
  env(safe-area-inset-*) prevents content from colliding with iPhone screen cutouts.
*/
.app{max-width:760px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 14px calc(28px + env(safe-area-inset-bottom))}

/* Header layout: title group on the left, project count on the right. */
.top{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:16px}

/* Small "Home Projects" label displayed above the main heading. */
.eyebrow{color:var(--muted);font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}

/* Main heading and dynamic project-count text. */
h1{font-size:28px;line-height:1.05;margin:4px 0 0}.count{font-size:13px;color:var(--muted)}

/* Search field + sort dropdown container. */
.controls{display:grid;grid-template-columns:1fr 126px;gap:8px;margin-bottom:12px}

/* Shared appearance for search and sort controls. */
.search,.sort{width:100%;min-height:44px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:0 12px}

/*
  Horizontally-scrollable status tabs.
  Scrollbars are hidden because the buttons themselves communicate scroll content.
*/
.tabs{display:flex;gap:7px;overflow:auto;padding:1px 0 12px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}

/* Status-filter pill buttons and selected-state appearance. */
.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 13px;white-space:nowrap}.tab.active{background:var(--dark);color:#fff;border-color:var(--dark)}

/*
  Project list and individual project cards.
  Project-card HTML is generated dynamically by app.js inside #list.
*/
.list{display:grid;gap:9px}.project{width:100%;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:14px;text-align:left;box-shadow:0 1px 2px rgba(0,0,0,.04)}

/* First row within a project card, including project number and main text area. */
.row1{display:flex;align-items:flex-start;gap:11px}.num{width:36px;height:36px;border-radius:11px;background:#f3f4f6;display:flex;align-items:center;justify-content:center;font-weight:800;flex:none}

/* Project title, metadata, and right-side chevron/arrow. */
.main{min-width:0;flex:1}.name{font-size:16px;font-weight:760;line-height:1.2}.meta{display:flex;flex-wrap:wrap;gap:6px 10px;color:var(--muted);font-size:13px;margin-top:6px}.chev{font-size:22px;color:#9ca3af;line-height:1}

/*
  Status badges generated by app.js.
  Class names match status codes from the spreadsheet/API:
  IP = In Progress, NTS = Not Started, COMP = Complete, KILL = Killed.
*/
.badge{display:inline-flex;align-items:center;border-radius:999px;padding:3px 8px;font-size:12px;font-weight:700}.badge.IP{background:#dbeafe;color:#1d4ed8}.badge.NTS{background:#fef3c7;color:#92400e}.badge.COMP{background:#dcfce7;color:#166534}.badge.KILL{background:#fee2e2;color:#991b1b}

/*
  Expandable project-detail panel.
  Hidden by default; app.js adds the "open" class when a project is selected.
*/
.sheet{display:none;margin-top:12px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px}.sheet.open{display:block}

/* Detail-panel heading and close button. */
.sheethead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.sheet h2{font-size:22px;margin:3px 0 2px}.close{border:1px solid var(--line);background:#fff;border-radius:12px;min-width:44px;min-height:44px}

/* Two-column project-detail grid and its field styling. */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}.field{border-top:1px solid var(--line);padding-top:10px;min-width:0}.label{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}.value{margin-top:4px;font-size:15px;word-break:break-word}.full{grid-column:1/-1}

/* Buttons/links shown at the bottom of the project-detail panel. */
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.action{display:inline-flex;align-items:center;justify-content:center;min-height:44px;border-radius:12px;padding:0 14px;text-decoration:none;font-weight:700;border:1px solid var(--line);color:var(--text);background:#fff}.action.primary{background:var(--dark);border-color:var(--dark);color:#fff}

/* Small application/API status message displayed below the main content. */
.statusline{font-size:12px;color:var(--muted);text-align:center;margin-top:12px}

/*
  MOBILE LAYOUT
  Below 430px wide, stack the search/sort controls and detail-grid columns.
*/
@media(max-width:430px){.controls{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
</head>
<body>

<!-- ========================================================================
     MAIN APPLICATION CONTAINER
     ======================================================================== -->
<div class="app">

<!--
  PAGE HEADER
  #count begins as "Loading…" and is updated by app.js after project data loads.
-->
<header class="top"><div><div class="eyebrow">Home Projects</div><h1>Next 10</h1></div><div class="count" id="count">Loading…</div></header>

<!--
  SEARCH + SORT CONTROLS
  app.js listens for changes to #search and #sort and re-renders the project list.
-->
<div class="controls"><input id="search" class="search" type="search" placeholder="Search projects…"><select id="sort" class="sort"><option value="next">Next projects</option><option value="priority">Priority rank</option><option value="costAsc">Cost: low to high</option><option value="costDesc">Cost: high to low</option><option value="name">Name</option></select></div>

<!--
  STATUS FILTER TABS
  The data-filter values are status codes used by the spreadsheet/API.
  "active" and "all" are front-end filter modes rather than spreadsheet statuses.
-->
<div class="tabs" id="tabs"><button class="tab active" data-filter="active">Active</button><button class="tab" data-filter="IP">In Progress</button><button class="tab" data-filter="NTS">Not Started</button><button class="tab" data-filter="all">All</button><button class="tab" data-filter="COMP">Complete</button></div>

<!--
  PROJECT LIST
  Initially empty. app.js creates and inserts the visible project cards here.
-->
<main id="list" class="list"></main>

<!--
  SPENDING SUMMARY
  app.js populates this container with spending information/calculations.
-->
<div id="spending"></div>

<!--
  PROJECT DETAIL PANEL
  app.js fills this container after a project card is selected and toggles
  the .open CSS class to make it visible.
-->
<div class="sheet" id="detail"></div>

<!--
  APP STATUS / DIAGNOSTIC TEXT
  Used by app.js for loading/error/connection status messages.
-->
<div class="statusline" id="statusline"></div>
</div>

<!--
  MAIN FRONT-END JAVASCRIPT
  IMPORTANT: Most app behavior is NOT contained in this index file.

  ?v=11 acts as a cache-busting version number. When app.js changes, increasing
  this value can force browsers/PWA caches to request the newer JavaScript file.
-->
<script src="app.js?v=11"></script>

</body>
</html>
