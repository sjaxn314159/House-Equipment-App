<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1f4e78">

  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Equipment">

  <title>House Equipment</title>

  <style>
    :root {
      --blue: #1f4e78;
      --blue2: #2f75b5;
      --light: #f3f6f9;
      --border: #d6dde5;
      --text: #1f2933;
      --muted: #66737f;
      --danger: #b42318;
      --warning: #b26a00;
      --success: #18794e;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--light);
      color: var(--text);
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    .app {
      max-width: 900px;
      margin: 0 auto;
      min-height: 100vh;
    }

    .header {
      background: var(--blue);
      color: white;
      padding: 16px;
      position: sticky;
      top: 0;
      z-index: 20;
      box-shadow: 0 2px 8px rgba(0,0,0,.15);
    }

    .header h1 {
      margin: 0 0 12px;
      font-size: 24px;
    }

    .nav {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }

    .nav-btn {
      border: 1px solid rgba(255,255,255,.45);
      background: rgba(255,255,255,.12);
      color: white;
      padding: 10px 12px;
      border-radius: 9px;
      cursor: pointer;
      font-weight: 700;
    }

    .nav-btn.active {
      background: white;
      color: var(--blue);
    }

    .search {
      width: 100%;
      font-size: 16px;
      padding: 12px 14px;
      border-radius: 10px;
      border: none;
      outline: none;
    }

    .filters {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }

    .filters.two {
      grid-template-columns: 2fr 1fr;
    }

    .filters select {
      width: 100%;
      font-size: 15px;
      padding: 10px;
      border: none;
      border-radius: 8px;
    }

    .toolbar {
      padding: 12px 12px 0;
      display: flex;
      justify-content: flex-end;
    }

    .summary {
      padding: 12px 16px 4px;
      color: var(--muted);
      font-size: 14px;
    }

    .cards {
      padding: 8px 12px 30px;
    }

    .card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 10px;
      padding: 14px;
      cursor: pointer;
      box-shadow: 0 1px 4px rgba(0,0,0,.05);
    }

    .card:hover {
      border-color: #9fb5c9;
    }

    .card-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .card-location {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .card-info {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      font-size: 13px;
    }

    .tag {
      background: #e9eef3;
      padding: 4px 8px;
      border-radius: 999px;
    }

    .tier1 {
      background: #fde7e4;
      color: #912018;
    }

    .tier2 {
      background: #fff1d6;
      color: #895400;
    }

    .tier3 {
      background: #e4f3ea;
      color: #11663d;
    }

    .future {
      background: #eee7f6;
      color: #62428d;
    }

    .complete-yes {
      background: #e4f3ea;
      color: #11663d;
    }

    .complete-no {
      background: #fde7e4;
      color: #912018;
    }

    .doc-wi {
      background: #e7f0fb;
      color: #174f82;
    }

    .doc-qg {
      background: #e4f3ea;
      color: #11663d;
    }

    .doc-opl {
      background: #fff1d6;
      color: #895400;
    }


    .pm-overdue {
      background: #fde7e4;
      color: #912018;
    }

    .pm-due-soon {
      background: #fff1d6;
      color: #895400;
    }

    .pm-open {
      background: #e7f0fb;
      color: #174f82;
    }

    .pm-inactive {
      background: #e9eef3;
      color: #66737f;
    }

    .parts-list {
      display: grid;
      gap: 8px;
    }

    .part-box {
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 10px;
      background: #f8fafc;
    }

    .part-box strong {
      display: block;
      margin-bottom: 4px;
    }

    .small-note {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 40px 20px;
    }

    .error {
      background: #fde7e4;
      color: var(--danger);
      margin: 16px;
      padding: 12px;
      border-radius: 8px;
    }

    .success {
      background: #e4f3ea;
      color: var(--success);
      margin: 12px 0;
      padding: 12px;
      border-radius: 8px;
    }

    .loading {
      text-align: center;
      padding: 35px;
      color: var(--muted);
    }

    .view {
      display: none;
    }

    .view.active {
      display: block;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.52);
      z-index: 100;
      overflow-y: auto;
    }

    .modal.show {
      display: block;
    }

    .modal-panel {
      background: white;
      max-width: 720px;
      margin: 20px auto;
      min-height: calc(100vh - 40px);
      border-radius: 14px;
      overflow: hidden;
    }

    .modal-header {
      background: var(--blue);
      color: white;
      padding: 16px;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .modal-header h2 {
      margin: 0;
      font-size: 21px;
      flex: 1;
    }

    .close {
      border: none;
      background: rgba(255,255,255,.16);
      color: white;
      height: 40px;
      width: 40px;
      border-radius: 50%;
      font-size: 22px;
      cursor: pointer;
    }

    .detail-body {
      padding: 16px;
    }

    .section {
      margin-bottom: 22px;
    }

    .section h3 {
      font-size: 15px;
      text-transform: uppercase;
      color: var(--blue);
      margin: 0 0 8px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 6px;
    }

    .detail-row {
      display: grid;
      grid-template-columns: 140px 1fr;
      gap: 8px;
      padding: 6px 0;
    }

    .label {
      color: var(--muted);
      font-size: 14px;
    }

    .value {
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    .buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 16px;
    }

    .btn {
      display: inline-block;
      padding: 11px 14px;
      border-radius: 8px;
      background: var(--blue2);
      color: white;
      text-decoration: none;
      border: none;
      font-size: 14px;
      cursor: pointer;
    }

    .btn.secondary {
      background: #e9eef3;
      color: var(--text);
    }

    .btn.success-btn {
      background: var(--success);
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .field {
      margin-bottom: 12px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    .field label {
      display: block;
      margin-bottom: 5px;
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
    }

    .field input,
    .field select,
    .field textarea {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: white;
      color: var(--text);
    }

    .field textarea {
      min-height: 90px;
      resize: vertical;
    }

    .maintenance-card .card-title {
      font-size: 16px;
    }

    .maintenance-description {
      margin: 8px 0;
      line-height: 1.35;
    }

    @media (max-width: 600px) {
      .nav-btn {
        padding: 9px 5px;
        font-size: 13px;
      }

      .filters,
      .filters.two,
      .form-grid {
        grid-template-columns: 1fr;
      }

      .field.full {
        grid-column: auto;
      }

      .modal-panel {
        margin: 0;
        border-radius: 0;
        min-height: 100vh;
      }

      .detail-row {
        grid-template-columns: 110px 1fr;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <div class="header">
    <h1>House Equipment</h1>

    <div class="nav">
      <button id="equipmentTab" class="nav-btn active" type="button">
        Equipment
      </button>

      <button id="maintenanceTab" class="nav-btn" type="button">
        Maintenance
      </button>

      <button id="documentsTab" class="nav-btn" type="button">
        Documents
      </button>

      <button id="pmTab" class="nav-btn" type="button">
        PM
      </button>
    </div>

    <div id="equipmentHeader">
      <input
        id="search"
        class="search"
        type="search"
        placeholder="Search equipment, make, model, serial #..."
      >

      <div class="filters">
        <select id="floorFilter">
          <option value="">All Floors</option>
        </select>

        <select id="areaFilter">
          <option value="">All Areas</option>
        </select>

        <select id="criticalFilter">
          <option value="">All Criticality</option>
        </select>
      </div>
    </div>

    <div id="maintenanceHeader" style="display:none;">
      <input
        id="maintenanceSearch"
        class="search"
        type="search"
        placeholder="Search maintenance logs..."
      >

      <div class="filters two">
        <select id="maintenanceEquipmentFilter">
          <option value="">All Equipment</option>
        </select>

        <select id="maintenanceCompleteFilter">
          <option value="">All Status</option>
          <option value="Yes">Complete</option>
          <option value="No">Incomplete</option>
        </select>
      </div>
    </div>

    <div id="documentsHeader" style="display:none;">
      <input
        id="documentsSearch"
        class="search"
        type="search"
        placeholder="Search document #, title, or type..."
      >

      <div class="filters two">
        <select id="documentsTypeFilter">
          <option value="">All Document Types</option>
          <option value="Work Instruction">Work Instructions</option>
          <option value="Quick Guide">Quick Guides</option>
          <option value="One Point Lesson">One Point Lessons</option>
        </select>

        <select id="documentsReleaseFilter">
          <option value="">All Documents</option>
          <option value="released">Released</option>
          <option value="draft">No Release Date</option>
        </select>
      </div>
    </div>

    <div id="pmHeader" style="display:none;">
      <input
        id="pmSearch"
        class="search"
        type="search"
        placeholder="Search PM task, equipment, JIN, spare part..."
      >

      <div class="filters two">
        <select id="pmEquipmentFilter">
          <option value="">All Equipment</option>
        </select>

        <select id="pmStatusFilter">
          <option value="open">Open PMs</option>
          <option value="all">All PMs</option>
          <option value="overdue">Overdue Only</option>
        </select>
      </div>
    </div>
  </div>

  <div id="equipmentView" class="view active">
    <div id="equipmentSummary" class="summary"></div>

    <div id="loading" class="loading">
      Loading equipment...
    </div>

    <div id="error"></div>

    <div id="cards" class="cards"></div>
  </div>

  <div id="maintenanceView" class="view">
    <div class="toolbar">
      <button id="newLogButton" class="btn success-btn" type="button">
        ＋ New Maintenance Log
      </button>
    </div>

    <div id="maintenanceSummary" class="summary"></div>

    <div id="maintenanceCards" class="cards"></div>
  </div>

  <div id="documentsView" class="view">
    <div id="documentsSummary" class="summary"></div>
    <div id="documentsCards" class="cards"></div>
  </div>

  <div id="pmView" class="view">
    <div class="toolbar">
      <button id="newPMButton" class="btn success-btn" type="button">
        ＋ Add New PM
      </button>
    </div>

    <div id="pmSummary" class="summary"></div>
    <div id="pmCards" class="cards"></div>
  </div>

</div>


<div id="modal" class="modal">
  <div class="modal-panel">

    <div class="modal-header">
      <h2 id="modalTitle"></h2>

      <button id="closeModal" class="close" type="button">
        ×
      </button>
    </div>

    <div id="detailBody" class="detail-body"></div>

  </div>
</div>


<div id="formModal" class="modal">
  <div class="modal-panel">

    <div class="modal-header">
      <h2>New Maintenance Log</h2>

      <button id="closeFormModal" class="close" type="button">
        ×
      </button>
    </div>

    <div class="detail-body">

      <form id="maintenanceForm">

        <div class="form-grid">

          <div class="field full">
            <label for="formEquipment">Equipment *</label>
            <select id="formEquipment" required>
              <option value="">Select equipment...</option>
            </select>
          </div>

          <div class="field">
            <label for="formDate">Date *</label>
            <input id="formDate" type="date" required>
          </div>

          <div class="field">
            <label for="formPerformedBy">Performed By</label>
            <input id="formPerformedBy" type="text">
          </div>

          <div class="field full">
            <label for="formDescription">Description *</label>
            <textarea id="formDescription" required></textarea>
          </div>

          <div class="field">
            <label for="formComplete">Complete?</label>
            <select id="formComplete">
              <option value="Yes">Yes</option>
              <option value="No">No</option>
            </select>
          </div>

          <div class="field">
            <label for="formWI">WI</label>
            <input id="formWI" type="text">
          </div>

          <div class="field">
            <label for="formSpareQty">Spares Qty</label>
            <input id="formSpareQty" type="number" min="0" step="1">
          </div>

          <div class="field">
            <label for="formSpareId">Spare ID</label>
            <input id="formSpareId" type="text">
          </div>

          <div class="field full">
            <label for="formSpareDescription">Spare Description</label>
            <input id="formSpareDescription" type="text">
          </div>

          <div class="field full">
            <label for="formNextStep">Next Step</label>
            <textarea id="formNextStep"></textarea>
          </div>

          <div class="field full">
            <label for="formLink">Link (optional URL)</label>
            <input
              id="formLink"
              type="url"
              placeholder="https://..."
            >
          </div>

        </div>

        <div id="formMessage"></div>

        <div class="buttons">
          <button id="saveLogButton" class="btn success-btn" type="submit">
            Save Log
          </button>

          <button id="cancelLogButton" class="btn secondary" type="button">
            Cancel
          </button>
        </div>

      </form>

    </div>
  </div>
</div>


<div id="pmFormModal" class="modal">
  <div class="modal-panel">
    <div class="modal-header">
      <h2>Add New PM</h2>
      <button id="closePMFormModal" class="close" type="button">×</button>
    </div>

    <div class="detail-body">
      <form id="pmForm">
        <div class="form-grid">
          <div class="field full">
            <label for="pmFormJin">Equipment / JIN *</label>
            <select id="pmFormJin" required>
              <option value="">Select equipment...</option>
            </select>
          </div>

          <div class="field full">
            <label for="pmFormTask">PM Task *</label>
            <input id="pmFormTask" type="text" placeholder="Replace Furnace Filter" required>
          </div>

          <div class="field">
            <label for="pmFormStartDate">Start / First Due Date *</label>
            <input id="pmFormStartDate" type="date" required>
          </div>

          <div class="field">
            <label for="pmFormFrequency">Frequency *</label>
            <select id="pmFormFrequency" required>
              <option value="Monthly">Monthly</option>
              <option value="3 Months">Every 3 Months</option>
              <option value="6 Months">Every 6 Months</option>
              <option value="Annual">Annual</option>
              <option value="Weekly">Weekly</option>
              <option value="Biweekly">Biweekly</option>
              <option value="One Time">One Time</option>
              <option value="Custom Months">Custom Months</option>
            </select>
          </div>

          <div id="pmCustomMonthsField" class="field" style="display:none;">
            <label for="pmFormFrequencyMonths">Frequency Months</label>
            <input id="pmFormFrequencyMonths" type="number" min="1" step="1" placeholder="e.g. 18">
          </div>

          <div class="field full">
            <label for="pmFormSpareJins">Spare JIN(s)</label>
            <input id="pmFormSpareJins" type="text" placeholder="Example: 0.2.2-C, 0.2.2-G">
            <div id="pmSpareSuggestions" class="small-note"></div>
          </div>

          <div class="field full">
            <label for="pmFormWI">Related Work Instruction</label>
            <select id="pmFormWI">
              <option value="">None</option>
            </select>
          </div>

          <div class="field full">
            <label for="pmFormNotes">Notes</label>
            <textarea id="pmFormNotes"></textarea>
          </div>
        </div>

        <div id="pmFormMessage"></div>

        <div class="buttons">
          <button id="savePMButton" class="btn success-btn" type="submit">Save PM</button>
          <button id="cancelPMButton" class="btn secondary" type="button">Cancel</button>
        </div>
      </form>
    </div>
  </div>
</div>


<div id="completePMModal" class="modal">
  <div class="modal-panel">
    <div class="modal-header">
      <h2 id="completePMTitle">Complete PM</h2>
      <button id="closeCompletePMModal" class="close" type="button">×</button>
    </div>

    <div class="detail-body">
      <form id="completePMForm">
        <input id="completePMId" type="hidden">

        <div class="form-grid">
          <div class="field">
            <label for="completePMDate">Completion Date *</label>
            <input id="completePMDate" type="date" required>
          </div>

          <div class="field">
            <label for="completePMBy">Performed By</label>
            <input id="completePMBy" type="text">
          </div>

          <div class="field full">
            <label for="completePMNotes">Completion Notes</label>
            <textarea id="completePMNotes" placeholder="Optional notes about the work performed"></textarea>
          </div>
        </div>

        <div id="completePMMessage"></div>

        <div class="buttons">
          <button id="completePMButton" class="btn success-btn" type="submit">✓ Complete Task</button>
          <button id="cancelCompletePMButton" class="btn secondary" type="button">Cancel</button>
        </div>
      </form>
    </div>
  </div>
</div>


<script>

const API_URL =

const pmFormWI = document.getElementById("pmFormWI");
const pmFormNotes = document.getElementById("pmFormNotes");

const completePMModal = document.getElementById("completePMModal");
const closeCompletePMModal = document.getElementById("closeCompletePMModal");
const completePMForm = document.getElementById("completePMForm");
const completePMTitle = document.getElementById("completePMTitle");
const completePMId = document.getElementById("completePMId");
const completePMDate = document.getElementById("completePMDate");
const completePMBy = document.getElementById("completePMBy");
const completePMNotes = document.getElementById("completePMNotes");
const completePMMessage = document.getElementById("completePMMessage");
const completePMButton = document.getElementById("completePMButton");
const cancelCompletePMButton = document.getElementById("cancelCompletePMButton");


async function loadData() {

  try {

    const response = await fetch(API_URL);

    if (!response.ok) {
      throw new Error("Could not load app data.");
    }

    const data = await response.json();

    if (!data.success) {
      throw new Error(data.error || "The equipment API returned an error.");
    }

    allEquipment = data.equipment || [];
    allMaintenance = data.maintenance || [];
    allDocuments = data.documents || [];
    allPM = data.pm || [];
    allSpareParts = data.spareParts || [];

    loading.style.display = "none";

    buildFilters();
    buildMaintenanceEquipmentLists();
    buildPMLists();

    renderEquipment();
    renderMaintenance();
    renderDocuments();
    renderPM();

  } catch (err) {

    loading.style.display = "none";

    errorBox.innerHTML =
      `<div class="error">${escapeHtml(err.message)}</div>`;

  }

}


function switchView(viewName) {

  const equipmentActive = viewName === "equipment";
  const maintenanceActive = viewName === "maintenance";
  const documentsActive = viewName === "documents";
  const pmActive = viewName === "pm";

  equipmentTab.classList.toggle("active", equipmentActive);
  maintenanceTab.classList.toggle("active", maintenanceActive);
  documentsTab.classList.toggle("active", documentsActive);
  pmTab.classList.toggle("active", pmActive);

  equipmentHeader.style.display =
    equipmentActive ? "block" : "none";

  maintenanceHeader.style.display =
    maintenanceActive ? "block" : "none";

  documentsHeader.style.display =
    documentsActive ? "block" : "none";

  pmHeader.style.display =
    pmActive ? "block" : "none";

  equipmentView.classList.toggle("active", equipmentActive);
  maintenanceView.classList.toggle("active", maintenanceActive);
  documentsView.classList.toggle("active", documentsActive);
  pmView.classList.toggle("active", pmActive);

  window.scrollTo({ top: 0, behavior: "smooth" });

}

function buildFilters() {

  const floors = uniqueValues(allEquipment, "floor");
  const areas = uniqueValues(allEquipment, "area");
  const critical = uniqueValues(allEquipment, "critical");

  fillSelect(floorFilter, floors);
  fillSelect(areaFilter, areas);
  fillSelect(criticalFilter, critical);

}


function buildMaintenanceEquipmentLists() {

  const items = [...allEquipment]
    .filter(item => item.id)
    .sort((a,b) =>
      compareText(a.id, b.id)
    );

  items.forEach(item => {

    const label =
      item.equipment
        ? `${item.equipment} — ${item.id}`
        : item.id;

    const filterOption =
      document.createElement("option");

    filterOption.value = item.id;
    filterOption.textContent = label;

    maintenanceEquipmentFilter.appendChild(filterOption);


    const formOption =
      document.createElement("option");

    formOption.value = item.id;
    formOption.textContent = label;

    formEquipment.appendChild(formOption);

  });

}


function buildPMLists() {

  pmEquipmentFilter.innerHTML = '<option value="">All Equipment</option>';
  pmFormJin.innerHTML = '<option value="">Select equipment...</option>';
  pmFormWI.innerHTML = '<option value="">None</option>';

  [...allEquipment]
    .map(item => ({
      item,
      // Use the JIN field returned by Apps Script. V4 now reads it from the actual column labeled JIN,
      // so values such as 0.1.3 are preserved even if columns move in the sheet.
      pmJin: item.jin || item.id || item.itemNumber
    }))
    .filter(entry => entry.pmJin)
    .sort((a,b) => compareText(a.pmJin, b.pmJin))
    .forEach(entry => {
      const item = entry.item;
      const pmJin = entry.pmJin;
      const label = `${item.equipment || "Equipment"} — JIN ${pmJin}`;

      const filterOption = document.createElement("option");
      filterOption.value = pmJin;
      filterOption.textContent = label;
      pmEquipmentFilter.appendChild(filterOption);

      const formOption = document.createElement("option");
      formOption.value = pmJin;
      formOption.textContent = label;
      pmFormJin.appendChild(formOption);
    });

  allDocuments
    .filter(doc => doc.shortType === "WI")
    .sort((a,b) => compareText(a.id, b.id))
    .forEach(doc => {
      const option = document.createElement("option");
      option.value = doc.id;
      option.textContent = [doc.id, doc.title].filter(Boolean).join(" — ");
      pmFormWI.appendChild(option);
    });
}


function uniqueValues(data, field) {

  return [...new Set(
    data
      .map(item => item[field])
      .filter(Boolean)
  )].sort();

}


function fillSelect(select, values) {

  values.forEach(value => {

    const option = document.createElement("option");

    option.value = value;
    option.textContent = value;

    select.appendChild(option);

  });

}


function renderEquipment() {

  const searchText = search.value.trim().toLowerCase();
  const floor = floorFilter.value;
  const area = areaFilter.value;
  const critical = criticalFilter.value;

  let filtered = allEquipment.filter(item => {

    if (floor && item.floor !== floor) return false;

    if (area && item.area !== area) return false;

    if (critical && item.critical !== critical) return false;


    if (searchText) {

      const text = [
        item.equipment,
        item.id,
        item.floor,
        item.area,
        item.make,
        item.model,
        item.serialNumber,
        item.details,
        item.powers
      ]
      .join(" ")
      .toLowerCase();

      if (!text.includes(searchText)) {
        return false;
      }

    }

    return true;

  });


  filtered.sort((a,b) => {

    return (
      compareText(a.floor, b.floor) ||
      compareText(a.area, b.area) ||
      compareItem(a.itemNumber, b.itemNumber)
    );

  });


  equipmentSummary.textContent =
    `${filtered.length} of ${allEquipment.length} items`;


  cards.innerHTML = "";


  if (!filtered.length) {

    cards.innerHTML =
      `<div class="empty">No equipment matches those filters.</div>`;

    return;

  }


  filtered.forEach(item => {

    const card = document.createElement("div");

    card.className = "card";

    const manufacturer =
      [item.make, item.model]
      .filter(Boolean)
      .join(" • ");


    card.innerHTML = `

      <div class="card-title">
        ${escapeHtml(item.equipment)}
      </div>

      <div class="card-location">
        ${escapeHtml(
          [item.floor, item.area]
          .filter(Boolean)
          .join(" • ")
        )}
      </div>

      <div class="card-info">

        ${item.id
          ? `<span class="tag">${escapeHtml(item.id)}</span>`
          : ""
        }

        ${manufacturer
          ? `<span class="tag">${escapeHtml(manufacturer)}</span>`
          : ""
        }

        ${criticalTag(item.critical)}

        ${unitTag(item.unit)}

      </div>

    `;


    card.addEventListener("click", () => openEquipmentDetail(item));

    cards.appendChild(card);

  });

}


function renderMaintenance() {

  const searchText =
    maintenanceSearch.value.trim().toLowerCase();

  const equipment =
    maintenanceEquipmentFilter.value;

  const complete =
    maintenanceCompleteFilter.value;


  let filtered = allMaintenance.filter(log => {

    if (equipment && log.equipment !== equipment) {
      return false;
    }

    if (complete && normalizeYesNo(log.complete) !== complete) {
      return false;
    }

    if (searchText) {

      const text = [
        log.id,
        log.equipment,
        log.date,
        log.performedBy,
        log.description,
        log.wi,
        log.complete,
        log.spareQty,
        log.spareId,
        log.spareDescription,
        log.nextStep
      ]
      .join(" ")
      .toLowerCase();

      if (!text.includes(searchText)) {
        return false;
      }

    }

    return true;

  });


  filtered.sort((a,b) => {

    const dateA = parseSortableDate(a);
    const dateB = parseSortableDate(b);

    if (dateA !== dateB) {
      return dateB - dateA;
    }

    return compareText(b.id, a.id);

  });


  maintenanceSummary.textContent =
    `${filtered.length} of ${allMaintenance.length} maintenance logs`;


  maintenanceCards.innerHTML = "";


  if (!filtered.length) {

    maintenanceCards.innerHTML =
      `<div class="empty">No maintenance logs match those filters.</div>`;

    return;

  }


  filtered.forEach(log => {

    const equipmentItem =
      allEquipment.find(item => item.id === log.equipment);

    const equipmentLabel =
      equipmentItem?.equipment || log.equipment || "Maintenance Log";

    const card = document.createElement("div");

    card.className = "card maintenance-card";

    card.innerHTML = `

      <div class="card-title">
        ${escapeHtml(equipmentLabel)}
      </div>

      <div class="card-location">
        ${escapeHtml(
          [log.date, log.performedBy]
          .filter(Boolean)
          .join(" • ")
        )}
      </div>

      <div class="maintenance-description">
        ${escapeHtml(log.description)}
      </div>

      <div class="card-info">

        ${log.id
          ? `<span class="tag">${escapeHtml(log.id)}</span>`
          : ""
        }

        ${completeTag(log.complete)}

        ${log.spareDescription
          ? `<span class="tag">${escapeHtml(log.spareDescription)}</span>`
          : ""
        }

      </div>

    `;

    card.addEventListener("click", () => openMaintenanceDetail(log));

    maintenanceCards.appendChild(card);

  });

}


function renderDocuments() {

  const searchText =
    documentsSearch.value.trim().toLowerCase();

  const type =
    documentsTypeFilter.value;

  const releaseFilter =
    documentsReleaseFilter.value;

  let filtered = allDocuments.filter(doc => {

    if (type && doc.type !== type) {
      return false;
    }

    if (releaseFilter === "released" && !doc.releaseDate) {
      return false;
    }

    if (releaseFilter === "draft" && doc.releaseDate) {
      return false;
    }

    if (searchText) {

      const text = [
        doc.id,
        doc.title,
        doc.type,
        doc.shortType,
        doc.revision,
        doc.releaseDate
      ]
      .join(" ")
      .toLowerCase();

      if (!text.includes(searchText)) {
        return false;
      }

    }

    return true;

  });


  const typeOrder = {
    "Work Instruction": 1,
    "Quick Guide": 2,
    "One Point Lesson": 3
  };

  filtered.sort((a,b) =>
    (typeOrder[a.type] || 99) - (typeOrder[b.type] || 99) ||
    compareText(a.id, b.id) ||
    compareText(a.title, b.title)
  );


  documentsSummary.textContent =
    `${filtered.length} of ${allDocuments.length} documents`;

  documentsCards.innerHTML = "";


  if (!filtered.length) {

    documentsCards.innerHTML =
      `<div class="empty">No documents match those filters.</div>`;

    return;

  }


  filtered.forEach(doc => {

    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `

      <div class="card-title">
        ${escapeHtml(doc.title || doc.id || "Document")}
      </div>

      <div class="card-location">
        ${escapeHtml(
          [
            doc.id,
            doc.releaseDate ? `Released ${doc.releaseDate}` : ""
          ]
          .filter(Boolean)
          .join(" • ")
        )}
      </div>

      <div class="card-info">

        ${documentTypeTag(doc)}

        ${doc.revision
          ? `<span class="tag">Rev ${escapeHtml(doc.revision)}</span>`
          : ""
        }

        ${doc.link
          ? `<span class="tag">Linked</span>`
          : `<span class="tag">No Link</span>`
        }

      </div>

    `;

    card.addEventListener(
      "click",
      () => openDocumentDetail(doc)
    );

    documentsCards.appendChild(card);

  });

}


function renderPM() {

  const searchText = pmSearch.value.trim().toLowerCase();
  const equipmentJin = pmEquipmentFilter.value;
  const statusFilter = pmStatusFilter.value;
  const now = startOfLocalDay(new Date()).getTime();

  let filtered = allPM.filter(pm => {
    const open = isPMOpen(pm);
    const dueTime = pmDueTime(pm);
    const overdue = open && dueTime > 0 && dueTime < now;

    if (statusFilter === "open" && !open) return false;
    if (statusFilter === "overdue" && !overdue) return false;
    if (equipmentJin && pm.jin !== equipmentJin) return false;

    if (searchText) {
      const eq = equipmentForJin(pm.jin);
      const parts = sparePartsForPM(pm);
      const text = [
        pm.id, pm.task, pm.jin, pm.status, pm.frequency,
        pm.relatedWI, pm.notes, eq?.equipment, eq?.floor, eq?.area,
        ...parts.flatMap(p => [p.spareJin, p.item, p.manufacturer, p.partNumber])
      ].filter(Boolean).join(" ").toLowerCase();

      if (!text.includes(searchText)) return false;
    }

    return true;
  });

  filtered.sort((a,b) => {
    const da = pmDueTime(a) || Number.MAX_SAFE_INTEGER;
    const db = pmDueTime(b) || Number.MAX_SAFE_INTEGER;
    return da - db || compareText(a.id, b.id);
  });

  const openCount = allPM.filter(isPMOpen).length;
  const overdueCount = allPM.filter(pm => isPMOpen(pm) && pmDueTime(pm) > 0 && pmDueTime(pm) < now).length;
  pmSummary.textContent = `${filtered.length} shown • ${openCount} open • ${overdueCount} overdue`;
  pmCards.innerHTML = "";

  if (!filtered.length) {
    pmCards.innerHTML = '<div class="empty">No PM tasks match those filters.</div>';
    return;
  }

  filtered.forEach(pm => {
    const eq = equipmentForJin(pm.jin);
    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      <div class="card-title">${escapeHtml(`${pm.id}: ${pm.task}`)}</div>
      <div class="card-location">
        ${escapeHtml([
          eq?.equipment,
          eq ? [eq.floor, eq.area].filter(Boolean).join(" / ") : "",
          pm.jin ? `JIN ${pm.jin}` : ""
        ].filter(Boolean).join(" • "))}
      </div>
      <div class="card-info">
        ${pmStatusTag(pm)}
        ${pm.nextDue ? `<span class="tag">Due ${escapeHtml(pm.nextDue)}</span>` : ""}
        ${pm.frequency ? `<span class="tag">${escapeHtml(pm.frequency)}</span>` : ""}
      </div>
    `;

    card.addEventListener("click", () => openPMDetail(pm));
    pmCards.appendChild(card);
  });
}


function openPMDetail(pm) {

  const eq = equipmentForJin(pm.jin);
  const parts = sparePartsForPM(pm);
  const wi = relatedDocument(pm.relatedWI);

  modalTitle.textContent = `${pm.id}: ${pm.task}`;

  const partsHtml = parts.length
    ? `<div class="section"><h3>Required Spare Parts</h3><div class="parts-list">${parts.map(part => `
        <div class="part-box">
          <strong>${escapeHtml(part.item || part.description || part.spareJin)}</strong>
          <div class="small-note">${escapeHtml([
            part.spareJin ? `Spare JIN ${part.spareJin}` : "",
            part.manufacturer,
            part.partNumber ? `PN ${part.partNumber}` : "",
            part.storageLocation ? `Stored: ${part.storageLocation}` : "",
            part.onHand ? `On hand: ${part.onHand}` : ""
          ].filter(Boolean).join(" • "))}</div>
          ${part.link ? `<div class="buttons"><a class="btn secondary" href="${escapeHtml(part.link)}" target="_blank" rel="noopener noreferrer">🔗 View / Buy Part</a></div>` : ""}
        </div>
      `).join("")}</div></div>`
    : (pm.spareJins
      ? `<div class="section"><h3>Required Spare Parts</h3><div class="small-note">Spare JIN(s): ${escapeHtml(pm.spareJins)} — no matching rows were found in Spare Parts.</div></div>`
      : "");

  const wiButton = wi?.link
    ? `<a class="btn" href="${escapeHtml(wi.link)}" target="_blank" rel="noopener noreferrer">📄 Open ${escapeHtml(wi.id || "Work Instruction")}</a>`
    : "";

  detailBody.innerHTML = `
    ${section("PM Task", [
      ["PM ID", pm.id],
      ["Status", pm.status],
      ["Task", pm.task],
      ["Start Date", pm.startDate],
      ["Frequency", pm.frequency],
      ["Last Completed", pm.lastCompleted],
      ["Next Due", pm.nextDue],
      ["Related WI", pm.relatedWI],
      ["Notes", pm.notes]
    ])}

    ${section("Equipment / Location", [
      ["Equipment", eq?.equipment],
      ["JIN", pm.jin],
      ["Equipment ID", eq?.id],
      ["Floor", eq?.floor],
      ["Area", eq?.area],
      ["Make", eq?.make],
      ["Model", eq?.model]
    ])}

    ${partsHtml}

    <div class="buttons">
      ${wiButton}
      ${isPMOpen(pm) ? `<button class="btn success-btn" type="button" onclick="openCompletePM(${jsString(pm.id)})">✓ Complete Task</button>` : ""}
      ${eq?.id ? `<button class="btn secondary" type="button" onclick="showMaintenanceForEquipment(${jsString(eq.id)})">🧰 Maintenance History</button>` : ""}
    </div>
  `;

  modal.classList.add("show");
  document.body.style.overflow = "hidden";
}


function openNewPM() {
  pmForm.reset();
  pmFormStartDate.value = todayLocal();
  pmFormFrequency.value = "3 Months";
  pmFormFrequencyMonths.value = "";
  pmCustomMonthsField.style.display = "none";
  pmFormMessage.innerHTML = "";
  pmSpareSuggestions.textContent = "Select equipment to see matching spare parts.";
  pmFormModal.classList.add("show");
  document.body.style.overflow = "hidden";
}


function closeNewPM() {
  pmFormModal.classList.remove("show");
  if (!modal.classList.contains("show") && !completePMModal.classList.contains("show")) {
    document.body.style.overflow = "";
  }
}


function updatePMSpareSuggestions() {
  const jin = pmFormJin.value;
  const matches = allSpareParts.filter(p => p.jin === jin || (p.spareJin || "").startsWith(jin + "-"));

  if (!jin) {
    pmSpareSuggestions.textContent = "Select equipment to see matching spare parts.";
    return;
  }

  if (!matches.length) {
    pmSpareSuggestions.textContent = "No spare parts are currently linked to this JIN.";
    return;
  }

  pmSpareSuggestions.innerHTML = "Available: " + matches.map(p =>
    `<button type="button" class="btn secondary" style="padding:5px 8px;margin:3px 3px 0 0;" onclick="addSpareJinToPM(${jsString(p.spareJin)})">${escapeHtml(p.spareJin)} — ${escapeHtml(p.item || p.partNumber || "Part")}</button>`
  ).join("");
}


function addSpareJinToPM(spareJin) {
  const current = pmFormSpareJins.value.split(/[,;\n]+/).map(x => x.trim()).filter(Boolean);
  if (!current.includes(spareJin)) current.push(spareJin);
  pmFormSpareJins.value = current.join(", ");
}


async function submitPMForm(event) {
  event.preventDefault();
  pmFormMessage.innerHTML = "";
  savePMButton.disabled = true;
  savePMButton.textContent = "Saving...";

  const frequency = pmFormFrequency.value;
  const monthMap = { "Monthly": "1", "3 Months": "3", "6 Months": "6", "Annual": "12" };
  const months = frequency === "Custom Months" ? pmFormFrequencyMonths.value.trim() : (monthMap[frequency] || "");

  const params = new URLSearchParams();
  params.set("action", "addPM");
  params.set("jin", pmFormJin.value);
  params.set("task", pmFormTask.value.trim());
  params.set("startDate", pmFormStartDate.value);
  params.set("frequency", frequency === "Custom Months" ? `${months} Months` : frequency);
  params.set("frequencyMonths", months);
  params.set("spareJins", pmFormSpareJins.value.trim());
  params.set("relatedWI", pmFormWI.value);
  params.set("notes", pmFormNotes.value.trim());

  try {
    const response = await fetch(API_URL, { method: "POST", body: params });
    if (!response.ok) throw new Error("Could not save PM task.");
    const data = await response.json();
    if (!data.success) throw new Error(data.error || "Could not save PM task.");

    allPM.push(data.pm);
    renderPM();
    pmFormMessage.innerHTML = `<div class="success">Saved ${escapeHtml(data.pm.id)}.</div>`;

    setTimeout(() => {
      closeNewPM();
      switchView("pm");
    }, 650);
  } catch (err) {
    pmFormMessage.innerHTML = `<div class="error" style="margin:12px 0 0;">${escapeHtml(err.message)}</div>`;
  } finally {
    savePMButton.disabled = false;
    savePMButton.textContent = "Save PM";
  }
}


function openCompletePM(pmId) {
  const pm = allPM.find(x => x.id === pmId);
  if (!pm) return;

  closeDetail();
  completePMForm.reset();
  completePMId.value = pm.id;
  completePMDate.value = todayLocal();
  completePMBy.value = localStorage.getItem("maintenancePerformedBy") || "";
  completePMTitle.textContent = `Complete ${pm.id}: ${pm.task}`;
  completePMMessage.innerHTML = "";
  completePMModal.classList.add("show");
  document.body.style.overflow = "hidden";
}


function closeCompletePM() {
  completePMModal.classList.remove("show");
  if (!modal.classList.contains("show") && !pmFormModal.classList.contains("show")) {
    document.body.style.overflow = "";
  }
}


async function submitCompletePM(event) {
  event.preventDefault();
  completePMMessage.innerHTML = "";
  completePMButton.disabled = true;
  completePMButton.textContent = "Completing...";

  const params = new URLSearchParams();
  params.set("action", "completePM");
  params.set("pmId", completePMId.value);
  params.set("date", completePMDate.value);
  params.set("performedBy", completePMBy.value.trim());
  params.set("notes", completePMNotes.value.trim());

  try {
    const response = await fetch(API_URL, { method: "POST", body: params });
    if (!response.ok) throw new Error("Could not complete PM task.");
    const data = await response.json();
    if (!data.success) throw new Error(data.error || "Could not complete PM task.");

    if (completePMBy.value.trim()) {
      localStorage.setItem("maintenancePerformedBy", completePMBy.value.trim());
    }

    const pmIndex = allPM.findIndex(x => x.id === data.pm.id);
    if (pmIndex >= 0) allPM[pmIndex] = data.pm;
    else allPM.push(data.pm);

    if (data.log) allMaintenance.push(data.log);
    renderPM();
    renderMaintenance();

    completePMMessage.innerHTML = `<div class="success">Completed ${escapeHtml(data.pm.id)} and created maintenance log ${escapeHtml(data.log?.id || "")}.</div>`;
    setTimeout(() => {
      closeCompletePM();
      switchView("pm");
    }, 900);
  } catch (err) {
    completePMMessage.innerHTML = `<div class="error" style="margin:12px 0 0;">${escapeHtml(err.message)}</div>`;
  } finally {
    completePMButton.disabled = false;
    completePMButton.textContent = "✓ Complete Task";
  }
}


function equipmentForJin(jin) {
  return allEquipment.find(item => item.jin === jin || item.id === jin) || null;
}


function sparePartsForPM(pm) {
  const ids = String(pm.spareJins || "").split(/[,;\n]+/).map(x => x.trim()).filter(Boolean);
  return ids.map(id => allSpareParts.find(part => part.spareJin === id)).filter(Boolean);
}


function relatedDocument(id) {
  const target = String(id || "").trim();
  if (!target) return null;
  return allDocuments.find(doc => doc.id === target) || null;
}


function isPMOpen(pm) {
  const status = String(pm.status || "Open").trim().toLowerCase();
  return !["inactive", "complete", "completed", "closed", "cancelled", "canceled"].includes(status);
}


function pmDueTime(pm) {
  const value = pm.nextDueIso || pm.nextDue || pm.startDateIso || pm.startDate;
  if (!value) return 0;
  const isoTime = /^\d{4}-\d{2}-\d{2}$/.test(value)
    ? new Date(value + "T12:00:00").getTime()
    : new Date(value).getTime();
  return isNaN(isoTime) ? 0 : isoTime;
}


function pmStatusTag(pm) {
  if (!isPMOpen(pm)) return '<span class="tag pm-inactive">Inactive / Complete</span>';

  const due = pmDueTime(pm);
  if (!due) return '<span class="tag pm-open">Open</span>';

  const today = startOfLocalDay(new Date()).getTime();
  const days = Math.ceil((due - today) / 86400000);

  if (days < 0) return `<span class="tag pm-overdue">Overdue ${Math.abs(days)} day${Math.abs(days) === 1 ? "" : "s"}</span>`;
  if (days === 0) return '<span class="tag pm-due-soon">Due Today</span>';
  if (days <= 30) return `<span class="tag pm-due-soon">Due in ${days} days</span>`;
  return '<span class="tag pm-open">Open</span>';
}


function startOfLocalDay(date) {
  return new Date(date.getFullYear(), date.getMonth(), date.getDate());
}


function openDocumentDetail(doc) {

  modalTitle.textContent =
    doc.title || doc.id || "Document";

  const openButton = doc.link
    ? `
      <a
        class="btn"
        href="${escapeHtml(doc.link)}"
        target="_blank"
        rel="noopener noreferrer"
      >
        📄 Open Document
      </a>
    `
    : `<span class="tag">No document link has been added yet.</span>`;


  detailBody.innerHTML = `

    ${section("Document", [
      ["Document #", doc.id],
      ["Type", doc.type],
      ["Title", doc.title],
      ["Revision", doc.revision],
      ["Release Date", doc.releaseDate]
    ])}

    <div class="buttons">
      ${openButton}
    </div>

  `;

  modal.classList.add("show");
  document.body.style.overflow = "hidden";

}


function documentTypeTag(doc) {

  let cls = "";

  if (doc.shortType === "WI") cls = "doc-wi";
  if (doc.shortType === "QG") cls = "doc-qg";
  if (doc.shortType === "OPL") cls = "doc-opl";

  return `
    <span class="tag ${cls}">
      ${escapeHtml(doc.type)}
    </span>
  `;

}


function showDocumentsForEquipmentName(equipmentName) {

  closeDetail();

  documentsTypeFilter.value = "";
  documentsReleaseFilter.value = "";
  documentsSearch.value = equipmentName || "";

  switchView("documents");
  renderDocuments();

}


function openEquipmentDetail(item) {

  const folderButton = item.folder

        class="btn"

        target="_blank"
        rel="noopener noreferrer"

      ["Area", item.area],
      ["Item #", item.itemNumber],
      ["JIN", item.id || item.jin],
      ["Source JIN", item.jin]
    ])}

    ${section("Equipment", [
      ["Criticality", item.critical],
      ["Labeled", item.labeled],
      ["Unit", item.unit],
      ["Make", item.make],
      ["Model", item.model],
      ["Serial Number", item.serialNumber],
      ["Install Date", item.installDate]
    ])}

    ${section("Electrical", [
      ["Panel", item.panel],
      ["Breaker", item.breaker],
      ["Powers", item.powers]
    ])}

    ${section("Maintenance / Reference", [
      ["Batteries", item.batteries],
      ["Manual", item.manual],
      ["Key ID", item.keyId],
      ["Details", item.details]
    ])}

    <div class="buttons">

      <button

        onclick="showMaintenanceForEquipment(${jsString(item.id)})"

        🧰 View Maintenance History
      </button>

      <button
        class="btn success-btn"

        onclick="openNewLogForEquipment(${jsString(item.id)})"

        ＋ Add Maintenance Log
      </button>

      <button
        class="btn"
        type="button"
        onclick="showDocumentsForEquipmentName(${jsString(item.equipment)})"
      >
        📚 Related Documents
      </button>

      ${folderButton}

    </div>

  `;


  modal.classList.add("show");
  document.body.style.overflow = "hidden";

}


function openMaintenanceDetail(log) {

  const equipmentItem =
    allEquipment.find(item => item.id === log.equipment);

  modalTitle.textContent =
    equipmentItem?.equipment ||
    log.equipment ||
    "Maintenance Log";


  const linkButton = log.link
    ? `
      <a
        class="btn"
        href="${escapeHtml(log.link)}"
        target="_blank"
        rel="noopener noreferrer"
      >
        🔗 Open Link
      </a>
    `
    : "";


  detailBody.innerHTML = `

    ${section("Maintenance Log", [
      ["Log ID", log.id],
      ["Equipment", log.equipment],
      ["Date", log.date],
      ["Performed By", log.performedBy],
      ["Complete?", log.complete],
      ["WI", log.wi]
    ])}

    ${section("Work Performed", [
      ["Description", log.description],
      ["Next Step", log.nextStep]
    ])}

    ${section("Spares Consumed", [
      ["Quantity", log.spareQty],
      ["Spare ID", log.spareId],
      ["Description", log.spareDescription]
    ])}

    <div class="buttons">
      ${linkButton}

      ${log.equipment
        ? `
          <button
            class="btn success-btn"
            type="button"
            onclick="openNewLogForEquipment(${jsString(log.equipment)})"
          >
            ＋ Add Another Log
          </button>
        `
        : ""
      }
    </div>

  `;


  modal.classList.add("show");
  document.body.style.overflow = "hidden";

}


function showMaintenanceForEquipment(equipmentId) {

  closeDetail();

  maintenanceEquipmentFilter.value = equipmentId || "";
  maintenanceSearch.value = "";

  switchView("maintenance");
  renderMaintenance();

}


function openNewLogForEquipment(equipmentId) {

  closeDetail();
  openNewLog(equipmentId);

}


function openNewLog(equipmentId = "") {

  maintenanceForm.reset();

  formEquipment.value = equipmentId || "";
  formDate.value = todayLocal();
  formComplete.value = "Yes";

  const rememberedName =
    localStorage.getItem("maintenancePerformedBy") || "";

  formPerformedBy.value = rememberedName;

  formMessage.innerHTML = "";

  formModal.classList.add("show");
  document.body.style.overflow = "hidden";

}


async function submitMaintenanceForm(event) {

  event.preventDefault();

  formMessage.innerHTML = "";
  saveLogButton.disabled = true;
  saveLogButton.textContent = "Saving...";


  const params = new URLSearchParams();

  params.set("action", "addMaintenance");
  params.set("equipment", formEquipment.value);
  params.set("date", formDate.value);
  params.set("performedBy", formPerformedBy.value.trim());
  params.set("description", formDescription.value.trim());
  params.set("complete", formComplete.value);
  params.set("wi", formWI.value.trim());
  params.set("spareQty", formSpareQty.value.trim());
  params.set("spareId", formSpareId.value.trim());
  params.set("spareDescription", formSpareDescription.value.trim());
  params.set("nextStep", formNextStep.value.trim());
  params.set("link", formLink.value.trim());


  try {

    const response = await fetch(API_URL, {
      method: "POST",
      body: params
    });

    if (!response.ok) {
      throw new Error("Could not save maintenance log.");
    }

    const data = await response.json();

    if (!data.success) {
      throw new Error(data.error || "Could not save maintenance log.");
    }

    if (formPerformedBy.value.trim()) {
      localStorage.setItem(
        "maintenancePerformedBy",
        formPerformedBy.value.trim()
      );
    }

    allMaintenance.push(data.log);

    renderMaintenance();

    formMessage.innerHTML =
      `<div class="success">Saved ${escapeHtml(data.log.id)}.</div>`;

    setTimeout(() => {
      closeNewLog();
      switchView("maintenance");
    }, 650);

  } catch (err) {

    formMessage.innerHTML =
      `<div class="error" style="margin:12px 0 0;">${escapeHtml(err.message)}</div>`;

  } finally {

    saveLogButton.disabled = false;
    saveLogButton.textContent = "Save Log";

  }

}


function closeDetail() {

  modal.classList.remove("show");

  if (!formModal.classList.contains("show")) {
    document.body.style.overflow = "";
  }

}


function closeNewLog() {

  formModal.classList.remove("show");

  if (!modal.classList.contains("show")) {
    document.body.style.overflow = "";
  }

}


function section(title, rows) {

  const validRows =
    rows.filter(row =>
      row[1] !== undefined &&
      row[1] !== null &&
      row[1] !== ""
    );


  if (!validRows.length) {
    return "";
  }


  return `

    <div class="section">

      <h3>${escapeHtml(title)}</h3>

      ${validRows.map(row => `

        <div class="detail-row">

          <div class="label">
            ${escapeHtml(row[0])}
          </div>

          <div class="value">
            ${escapeHtml(row[1])}
          </div>

        </div>

      `).join("")}

    </div>

  `;

}


function criticalTag(value) {

  if (!value) return "";

  const v = value.toLowerCase();

  let cls = "";

  if (v.includes("tier 1")) cls = "tier1";
  if (v.includes("tier 2")) cls = "tier2";
  if (v.includes("tier 3")) cls = "tier3";

  return `
    <span class="tag ${cls}">
      ${escapeHtml(value)}
    </span>
  `;

}


function unitTag(value) {

  if (!value) return "";

  let cls = "";

  if (value.toLowerCase() === "future") {
    cls = "future";
  }

  return `
    <span class="tag ${cls}">
      ${escapeHtml(value)}
    </span>
  `;

}


function completeTag(value) {

  const normalized = normalizeYesNo(value);

  if (!normalized) return "";

  const cls =
    normalized === "Yes"
      ? "complete-yes"
      : "complete-no";

  const label =
    normalized === "Yes"
      ? "Complete"
      : "Incomplete";

  return `
    <span class="tag ${cls}">
      ${label}
    </span>
  `;

}


function normalizeYesNo(value) {

  const v = String(value || "").trim().toLowerCase();

  if (["yes", "y", "true", "complete", "completed"].includes(v)) {
    return "Yes";
  }

  if (["no", "n", "false", "incomplete", "open"].includes(v)) {
    return "No";
  }

  return String(value || "").trim();

}


function parseSortableDate(log) {

  if (log.dateIso) {
    const time = new Date(log.dateIso + "T12:00:00").getTime();

    if (!isNaN(time)) return time;
  }

  const time = new Date(log.date).getTime();

  return isNaN(time) ? 0 : time;

}


function todayLocal() {

  const now = new Date();

  const y = now.getFullYear();
  const m = String(now.getMonth() + 1).padStart(2, "0");
  const d = String(now.getDate()).padStart(2, "0");

  return `${y}-${m}-${d}`;

}


function compareText(a,b) {

  return String(a || "")
    .localeCompare(String(b || ""), undefined, {
      numeric: true,
      sensitivity: "base"
    });

}


function compareItem(a,b) {

  const aa = parseFloat(a);
  const bb = parseFloat(b);

  if (!isNaN(aa) && !isNaN(bb)) {
    return aa - bb;
  }

  return compareText(a,b);

}


function jsString(value) {
  return JSON.stringify(String(value ?? ""));
}


function escapeHtml(value) {

  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}

maintenanceTab.addEventListener("click", () => switchView("maintenance"));
documentsTab.addEventListener("click", () => switchView("documents"));
pmTab.addEventListener("click", () => switchView("pm"));

search.addEventListener("input", renderEquipment);
floorFilter.addEventListener("change", renderEquipment);
areaFilter.addEventListener("change", renderEquipment);
criticalFilter.addEventListener("change", renderEquipment);

maintenanceEquipmentFilter.addEventListener("change", renderMaintenance);
maintenanceCompleteFilter.addEventListener("change", renderMaintenance);

documentsSearch.addEventListener("input", renderDocuments);
documentsTypeFilter.addEventListener("change", renderDocuments);
documentsReleaseFilter.addEventListener("change", renderDocuments);

pmSearch.addEventListener("input", renderPM);
pmEquipmentFilter.addEventListener("change", renderPM);
pmStatusFilter.addEventListener("change", renderPM);

newLogButton.addEventListener("click", () => openNewLog());
newPMButton.addEventListener("click", openNewPM);
pmFormJin.addEventListener("change", updatePMSpareSuggestions);
pmFormFrequency.addEventListener("change", () => {
  pmCustomMonthsField.style.display = pmFormFrequency.value === "Custom Months" ? "block" : "none";
});

});

cancelLogButton.addEventListener("click", closeNewLog);

    closeNewLog();
  }
});

pmForm.addEventListener("submit", submitPMForm);
closePMFormModal.addEventListener("click", closeNewPM);
cancelPMButton.addEventListener("click", closeNewPM);
pmFormModal.addEventListener("click", event => {
  if (event.target === pmFormModal) closeNewPM();
});

completePMForm.addEventListener("submit", submitCompletePM);
closeCompletePMModal.addEventListener("click", closeCompletePM);
cancelCompletePMButton.addEventListener("click", closeCompletePM);
completePMModal.addEventListener("click", event => {
  if (event.target === completePMModal) closeCompletePM();
});

document.addEventListener("keydown", event => {

  if (event.key === "Escape") {

    if (completePMModal.classList.contains("show")) {
      closeCompletePM();
    } else if (pmFormModal.classList.contains("show")) {
      closeNewPM();
    } else if (formModal.classList.contains("show")) {
      closeNewLog();
    } else if (modal.classList.contains("show")) {
      closeDetail();
    }

  }

});


loadData();
