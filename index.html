async function loadData() {

  // DEBUG NOTE: Executes this statement as part of the surrounding function or data structure.
  try {

    // DEBUG NOTE: Creates constant response used by the following logic.
    const response = await fetch(API_URL);

    // DEBUG NOTE: Checks this condition before executing the nested logic.

      // DEBUG NOTE: Stops processing and returns a useful error when a required condition is missing.
      throw new Error("Could not load app data.");
    // DEBUG NOTE: Closes or separates the surrounding JavaScript structure.
    }

    // DEBUG NOTE: Creates constant data used by the following logic.
    const data = await response.json();

    // DEBUG NOTE: Checks this condition before executing the nested logic.
    if (!data.success) {
      // DEBUG NOTE: Stops processing and returns a useful error when a required condition is missing.
      throw new Error(data.error || "The equipment API returned an error.");
    // DEBUG NOTE: Closes or separates the surrounding JavaScript structure.
    }

    // DEBUG NOTE: Executes this statement as part of the surrounding function or data structure.
    allEquipment = data.equipment || [];
    // DEBUG NOTE: Executes this statement as part of the surrounding function or data structure.
    allMaintenance = data.maintenance || [];
    // DEBUG NOTE: Executes this statement as part of the surrounding function or data structure.
    allDocuments = data.documents || [];
    // DEBUG NOTE: Executes this statement as part of the surrounding function or data structure.
    allPM = data.pm || [];
    // DEBUG NOTE: Executes this statement as part of the surrounding function or data structure.
    allSpareParts = data.spareParts || [];

    // DEBUG NOTE: Executes this statement as part of the surrounding function or data structure.
    loading.style.display = "none";

    // DEBUG NOTE: Executes this statement as part of the surrounding function or data structure.

    // DEBUG NOTE: Executes this statement as part of the surrounding function or data structure.
    buildMaintenanceEquipmentLists();

    // DEBUG NOTE: Executes this statement as part of the surrounding function or data structure.

    // DEBUG NOTE: Executes this statement as part of the surrounding function or data structure.
    renderMaintenance();
    // DEBUG NOTE: Executes this statement as part of the surrounding function or data structure.
    renderDocuments();
    // DEBUG NOTE: Executes this statement as part of the surrounding function or data structure.
    renderPM();

  // DEBUG NOTE: Executes this statement as part of the surrounding function or data structure.
  } catch (err) {

    // DEBUG NOTE: Executes this statement as part of the surrounding function or data structure.

      // DEBUG NOTE: Executes this statement as part of the surrounding function or data structure.

    // DEBUG NOTE: Executes this statement as part of the surrounding function or data structure.

      // DEBUG NOTE: Executes this statement as part of the surrounding function or data structure.
      compareText(a.id, b.id)
    // DEBUG NOTE: Closes or separates the surrounding JavaScript structure.
    );

  // DEBUG NOTE: Runs the enclosed logic once for each item.
  items.forEach(item => {

    // DEBUG NOTE: Creates constant label used by the following logic.

      // DEBUG NOTE: Executes this statement as part of the surrounding function or data structure.

        // DEBUG NOTE: Executes this statement as part of the surrounding function or data structure.
        ? `${item.equipment} — ${item.id}`
        // DEBUG NOTE: Executes this statement as part of the surrounding function or data structure.
        : item.id;

    // DEBUG NOTE: Creates constant filterOption used by the following logic.
    const filterOption =
      // DEBUG NOTE: Executes this statement as part of the surrounding function or data structure.
      document.createElement("option");

    // DEBUG NOTE: Executes this statement as part of the surrounding function or data structure.
    filterOption.value = item.id;
    // DEBUG NOTE: Executes this statement as part of the surrounding function or data structure.

// DEBUG NOTE: Defines the renderPM function.
function renderPM() {

  // DEBUG NOTE: Creates constant searchText used by the following logic.
  const searchText = pmSearch.value.trim().toLowerCase();
  // DEBUG NOTE: Creates constant equipmentJin used by the following logic.
  const equipmentJin = pmEquipmentFilter.value;
  // DEBUG NOTE: Creates constant statusFilter used by the following logic.
  const statusFilter = pmStatusFilter.value;
  // DEBUG NOTE: Creates constant now used by the following logic.
  const now = startOfLocalDay(new Date()).getTime();

  // DEBUG NOTE: Creates mutable variable filtered used by the following logic.
  let filtered = allPM.filter(pm => {
    // DEBUG NOTE: Creates constant open used by the following logic.
    const open = isPMOpen(pm);
    // DEBUG NOTE: Creates constant dueTime used by the following logic.
    const dueTime = pmDueTime(pm);
    // DEBUG NOTE: Creates constant overdue used by the following logic.
    const overdue = open && dueTime > 0 && dueTime < now;

    // DEBUG NOTE: Checks this condition before executing the nested logic.
    if (statusFilter === "open" && !open) return false;
    // DEBUG NOTE: Checks this condition before executing the nested logic.
    if (statusFilter === "overdue" && !overdue) return false;
    // DEBUG NOTE: Checks this condition before executing the nested logic.
    if (equipmentJin && pm.jin !== equipmentJin) return false;

    // DEBUG NOTE: Checks this condition before executing the nested logic.
    if (searchText) {
      // DEBUG NOTE: Creates constant eq used by the following logic.
      const eq = equipmentForJin(pm.jin);
      // DEBUG NOTE: Creates constant parts used by the following logic.
      const parts = sparePartsForPM(pm);
      // DEBUG NOTE: Creates constant text used by the following logic.
      const text = [
        // DEBUG NOTE: Executes this statement as part of the surrounding function or data structure.
        pm.id, pm.task, pm.jin, pm.status, pm.frequency,
        // DEBUG NOTE: Executes this statement as part of the surrounding function or data structure.
        pm.relatedWI, pm.notes, eq?.equipment, eq?.floor, eq?.area,
        // DEBUG NOTE: Executes this statement as part of the surrounding function or data structure.

      // DEBUG NOTE: Keeps only items that satisfy the specified condition.
      ].filter(Boolean).join(" ").toLowerCase();

      // DEBUG NOTE: Checks this condition before executing the nested logic.
      if (!text.includes(searchText)) return false;
    // DEBUG NOTE: Closes or separates the surrounding JavaScript structure.
    }

    // DEBUG NOTE: Returns this value to the calling function or web request.
    return true;
  // DEBUG NOTE: Closes or separates the surrounding JavaScript structure.
  });

  // DEBUG NOTE: Executes this statement as part of the surrounding function or data structure.
  filtered.sort((a,b) => {
    // DEBUG NOTE: Creates constant da used by the following logic.
    const da = pmDueTime(a) || Number.MAX_SAFE_INTEGER;
    // DEBUG NOTE: Creates constant db used by the following logic.
    const db = pmDueTime(b) || Number.MAX_SAFE_INTEGER;
    // DEBUG NOTE: Returns this value to the calling function or web request.
    return da - db || compareText(a.id, b.id);
  // DEBUG NOTE: Closes or separates the surrounding JavaScript structure.
  });

  // DEBUG NOTE: Creates constant openCount used by the following logic.
  const openCount = allPM.filter(isPMOpen).length;
  // DEBUG NOTE: Creates constant overdueCount used by the following logic.
  const overdueCount = allPM.filter(pm => isPMOpen(pm) && pmDueTime(pm) > 0 && pmDueTime(pm) < now).length;
  // DEBUG NOTE: Executes this statement as part of the surrounding function or data structure.
  pmSummary.textContent = `${filtered.length} shown • ${openCount} open • ${overdueCount} overdue`;
  // DEBUG NOTE: Executes this statement as part of the surrounding function or data structure.
  pmCards.innerHTML = "";

  // DEBUG NOTE: Checks this condition before executing the nested logic.

  filtered.forEach(pm => {

        // DEBUG NOTE: Executes this statement as part of the surrounding function or data structure.
        ${escapeHtml([
          // DEBUG NOTE: Executes this statement as part of the surrounding function or data structure.
          eq?.equipment,
          // DEBUG NOTE: Keeps only items that satisfy the specified condition.
          eq ? [eq.floor, eq.area].filter(Boolean).join(" / ") : "",
          // DEBUG NOTE: Executes this statement as part of the surrounding function or data structure.
          pm.jin ? `JIN ${pm.jin}` : ""
        // DEBUG NOTE: Keeps only items that satisfy the specified condition.
        ].filter(Boolean).join(" • "))}
      // DEBUG NOTE: Executes this statement as part of the surrounding function or data structure.
      </div>
      // DEBUG NOTE: Executes this statement as part of the surrounding function or data structure.

// DEBUG NOTE: Defines the pmDueTime function.
function pmDueTime(pm) {
  // DEBUG NOTE: Creates constant value used by the following logic.
  const value = pm.nextDueIso || pm.nextDue || pm.startDateIso || pm.startDate;
  // DEBUG NOTE: Checks this condition before executing the nested logic.
  if (!value) return 0;
  // DEBUG NOTE: Creates constant isoTime used by the following logic.
  const isoTime = /^\d{4}-\d{2}-\d{2}$/.test(value)
    // DEBUG NOTE: Executes this statement as part of the surrounding function or data structure.
    ? new Date(value + "T12:00:00").getTime()
    // DEBUG NOTE: Executes this statement as part of the surrounding function or data structure.
    : new Date(value).getTime();
  // DEBUG NOTE: Returns this value to the calling function or web request.
  return isNaN(isoTime) ? 0 : isoTime;
// DEBUG NOTE: Closes or separates the surrounding JavaScript structure.
}


// DEBUG NOTE: Defines the pmStatusTag function.
function pmStatusTag(pm) {
  // DEBUG NOTE: Checks this condition before executing the nested logic.
  if (!isPMOpen(pm)) return '<span class="tag pm-inactive">Inactive / Complete</span>';

  // DEBUG NOTE: Creates constant due used by the following logic.
  const due = pmDueTime(pm);
  // DEBUG NOTE: Checks this condition before executing the nested logic.
  if (!due) return '<span class="tag pm-open">Open</span>';

  // DEBUG NOTE: Creates constant today used by the following logic.
  const today = startOfLocalDay(new Date()).getTime();
  // DEBUG NOTE: Creates constant days used by the following logic.
  const days = Math.ceil((due - today) / 86400000);

  // DEBUG NOTE: Checks this condition before executing the nested logic.
  if (days < 0) return `<span class="tag pm-overdue">Overdue ${Math.abs(days)} day${Math.abs(days) === 1 ? "" : "s"}</span>`;
  // DEBUG NOTE: Checks this condition before executing the nested logic.
  if (days === 0) return '<span class="tag pm-due-soon">Due Today</span>';
  // DEBUG NOTE: Checks this condition before executing the nested logic.
  if (days <= 30) return `<span class="tag pm-due-soon">Due in ${days} days</span>`;
  // DEBUG NOTE: Returns this value to the calling function or web request.
  return '<span class="tag pm-open">Open</span>';
// DEBUG NOTE: Closes or separates the surrounding JavaScript structure.
}


// DEBUG NOTE: Defines the startOfLocalDay function.
function startOfLocalDay(date) {
  // DEBUG NOTE: Returns this value to the calling function or web request.
  return new Date(date.getFullYear(), date.getMonth(), date.getDate());
// DEBUG NOTE: Closes or separates the surrounding JavaScript structure.
}
